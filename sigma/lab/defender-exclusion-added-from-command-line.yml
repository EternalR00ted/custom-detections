title: Defender exclusion added from the command line
name: defender-exclusion-added-from-command-line
id: 2f3feeb6-b1fa-45b5-922d-3aaca9632382
status: experimental
description: >-
  A process added a Microsoft Defender Antivirus exclusion from PowerShell or
  WMIC. Attackers add exclusions so Defender stops scanning their tools.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: Khalid Ozal
date: 2026-10-11
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\powershell_ise.exe'
      - '\wmic.exe'
  selection_command:
    CommandLine|contains|all:
      - 'MpPreference'
      - 'Exclusion'
  condition: all of selection_*
falsepositives:
  - Administrators or management tools adding exclusions on purpose
level: medium
