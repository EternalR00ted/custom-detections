# The only Atomic Red Team tests the lab VM may run. Add a test in its own
# pull request, with the SHA-256 of its file at the pinned commit. The AI can
# only pick tests from this list, and AI pull requests can't change it.
#
# The fire plan reads each test's command from the pinned file, checks the
# file's SHA-256, and shows you the exact command before you approve.
# Only tests with a powershell or command_prompt executor and no
# dependencies are allowed.
#
# Tiers follow the Canadian Centre for Cyber Security's purple loop:
#   baseline    the technique as the source describes it
#   cosmetic    the same command with trivial changes (case, aliases, order)
#   structural  the same effect through a different tool or path
#   behavioral  a different behavior that reaches the same goal

